services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: futsalpro
      POSTGRES_USER: futsalpro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for Compose}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futsalpro -d futsalpro"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Futsal.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__FutsalPro: Host=postgres;Port=5432;Database=futsalpro;Username=futsalpro;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for Compose}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
