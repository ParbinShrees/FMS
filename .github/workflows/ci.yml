name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: '10.0.x'}
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -warnaserror:NU1902,NU1903,NU1904
      - shell: pwsh
        run: ./tests/Futsal.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test -c Release --no-build --logger trx
      - shell: pwsh
        run: ./scripts/audit-dependencies.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: tests, path: '**/TestResults/*.trx'}
  images:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - run: |
          repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          for target in Api Web; do
            name=$(echo "$target" | tr '[:upper:]' '[:lower:]')
            docker build -f src/Futsal.$target/Dockerfile -t ghcr.io/$repo/$name:${{ github.sha }} .
            docker push ghcr.io/$repo/$name:${{ github.sha }}
          done
          docker build -f deploy/Backup.Dockerfile -t ghcr.io/$repo/backup:${{ github.sha }} .
          docker push ghcr.io/$repo/backup:${{ github.sha }}
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: images
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy through pinned SSH host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '/opt/futsalpro/deploy/update.sh' '${{ github.sha }}'
